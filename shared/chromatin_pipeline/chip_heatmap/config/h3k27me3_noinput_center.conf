# H3K27me3 displayed as a point-centred window instead of a scaled body.
#
# h3k27me3.conf picks scale-regions because H3K27me3 is normally a broad domain
# mark. In this dataset it is not: MACS2 --broad returned 29,594 peaks with a
# median width of 406 bp, p90 1,043 bp and a maximum of 4,102 bp, covering only
# 0.57% of the genome. gappedPeak linked nothing larger. Scaling a 406 bp peak
# to a 10 kb body stretches it 25x, and the flat-topped plateau in the
# scale-regions profile is that stretch, not a domain.
#
# The peaks are punctate, so they are shown the way punctate peaks are shown.
# Peak calling is unchanged: still --broad, so the region sets are identical to
# the scale-regions run, and only the display differs.
source "$HM_ROOT/config/h3k27me3_noinput.conf"
MATRIX_MODE=reference-point
MATRIX_BEFORE=3000
MATRIX_AFTER=3000
HEATMAP_WIDTH=4.8
