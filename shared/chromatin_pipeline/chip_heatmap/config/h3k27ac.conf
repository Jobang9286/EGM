# H3K27ac: active promoters and enhancers. Peaks are punctate, so narrow
# calling and a centred window, the same shape as H3K56ac. No Tn5 shift, and
# an input track still matters because ChIP background is not flat.
PEAK_MODE=narrow
MACS_EXTRA="--nomodel --extsize 200"   # no Tn5 shift
MACS_QVALUE=0.05
USE_CONTROL=1
BW_EXTEND=200
MATRIX_MODE=reference-point
MATRIX_BEFORE=3000
MATRIX_AFTER=3000
