# H3K27me3: broad repressive domains, often tens to hundreds of kb.
# Narrow calling fragments a single domain into dozens of specks, so use --broad,
# and plot scaled domain bodies rather than a point centre.
PEAK_MODE=broad
MACS_EXTRA="--nomodel --extsize 200"   # no Tn5 shift
MACS_QVALUE=0.05
MACS_BROAD_CUTOFF=0.1
USE_CONTROL=1                    # input/IgG strongly recommended for a broad mark
BW_EXTEND=200                    # mononucleosome fragment, not the ATAC 100
MATRIX_MODE=scale-regions
MATRIX_BEFORE=5000
MATRIX_AFTER=5000
MATRIX_BODY=10000
