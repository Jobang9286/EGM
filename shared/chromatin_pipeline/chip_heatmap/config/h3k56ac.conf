# H3K56ac: active acetylation, peaks are punctate and promoter-proximal,
# so narrow calling and a centred window behave like ATAC. Still no Tn5 shift,
# and still worth an input track because ChIP background is not flat.
PEAK_MODE=narrow
MACS_EXTRA="--nomodel --extsize 200"   # no Tn5 shift
MACS_QVALUE=0.05
USE_CONTROL=1
BW_EXTEND=200
MATRIX_MODE=reference-point
MATRIX_BEFORE=3000
MATRIX_AFTER=3000
