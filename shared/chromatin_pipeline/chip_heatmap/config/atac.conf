# ATAC-seq. Tn5 inserts as a dimer, so reads are shifted onto the cut site.
# This shift is ATAC-only: applying it to a ChIP library mislocates every peak.
PEAK_MODE=narrow
MACS_EXTRA="--nomodel --shift -100 --extsize 200"
MACS_QVALUE=0.05
USE_CONTROL=0                    # ATAC has no input track
BW_EXTEND=100
MATRIX_MODE=reference-point
MATRIX_BEFORE=3000
MATRIX_AFTER=3000
