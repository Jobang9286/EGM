# H3K27me3, 4FP_blood run.
# Same as h3k27me3.conf except USE_CONTROL; see h3k56ac_noinput.conf for why.
# This is the mark that loses the most from a missing input, since broad
# calling leans harder on the background model.
source "$HM_ROOT/config/h3k27me3.conf"
USE_CONTROL=0
# Four x ticks in a scaled-body plot need more room than the 7.5 default.
HEATMAP_WIDTH=6
