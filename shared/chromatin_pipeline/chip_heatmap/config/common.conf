# Shared defaults. A mark preset is sourced AFTER this file and overrides it.
#
# Site config for mouse (GRCm39) data.

REF_DIR=$HM_ROOT/../_setup/ref
GENOME=index/GRCm39              # bowtie2 index prefix inside REF_DIR
GENOME_FA="$REF_DIR/index/GRCm39.fa"
# ENCODE blacklist v2 has no mm39 release; this is the mm10 v2 list lifted with
# UCSC mm10ToMm39.over.chain (3360 of 3435 regions mapped).
BLACKLIST="$REF_DIR/mm39-blacklist.v2.bed"
MACS_GENOME=mm                   # macs2 -g
EFFECTIVE_GENOME_SIZE=2494787188 # deeptools GRCm38/39, read length 150 (reads are 151 bp)

THREADS=48                       # 128 cores; the two marks run side by side
PICARD_JAR=$HOME/.conda/envs/chipseq/share/picard-3.5.0-0/picard.jar
JAVA_XMX=32
TRIM_GALORE=$HOME/.conda/envs/chipseq/bin/trim_galore
CONDA_BIN=$HOME/.conda/envs/chipseq/bin   # deeptools 3.5.6, needed for bigwigAverage

PAIRED=1                         # 0 for single-end libraries
MAPQ=30
REMOVE_CHRM=1

# --- peak calling -----------------------------------------------------------
PEAK_MODE=narrow                 # narrow | broad
MACS_QVALUE=0.05
MACS_BROAD_CUTOFF=0.1            # only used when PEAK_MODE=broad
MACS_EXTRA=""                    # mark-specific flags, set by the preset
USE_CONTROL=0                    # 1 to pass an input/IgG track to macs2 -c

# --- coverage and matrix ----------------------------------------------------
BW_BINSIZE=10
BW_EXTEND=100                    # bamCoverage --extendReads
MATRIX_MODE=reference-point      # reference-point | scale-regions
MATRIX_BEFORE=3000
MATRIX_AFTER=3000
MATRIX_BODY=5000                 # scale-regions only
HEATMAP_COLOR="white,purple"
HEATMAP_HEIGHT=11
# Panel width in cm. scale-regions draws four x ticks (flank, start, end,
# flank) where reference-point draws three, so a broad-mark preset widens this
# to keep the labels from colliding.
HEATMAP_WIDTH=4.8

# Launcher for the patched plotHeatmap. lib/deeptools_patched (deeptools
# 3.3.2) will not import under this env's matplotlib, so use the port in
# lib/deeptools356_port instead; it applies the same layout change to 3.5.6.
PLOTHEATMAP_CMD="$HOME/.conda/envs/chipseq/bin/python $HM_ROOT/lib/deeptools356_port/plotheatmap_patched.py"

# Extra trim_galore flags.
#   --cores 8   cutadapt is otherwise single-threaded and becomes the bottleneck
#               at 25M pairs per sample; output is identical either way.
#   --poly_g    NovaSeq 2-colour no-signal bases are called as high-quality G.
#               trim_galore auto-detects this, forced here so a rerun cannot
#               silently decide otherwise. These libraries need it: 41% of
#               H3K56ac and 17% of H3K27me3 reads carry a 20-base G run.
TRIM_GALORE_EXTRA="--cores 8 --poly_g"

# Region groups kept as heatmap rows but left out of the summary profile.
# With three groups the Shared curve mostly traces the envelope of the other
# two, so it crowds the panel without adding information the rows do not
# already show. Empty string plots every group.
HEATMAP_HIDE_PROFILE_GROUPS="Shared"

# Labels for the two edges of a scaled region body. deeptools defaults to
# TSS/TES, which is wrong for peak domains and collides with the flank tick.
MATRIX_START_LABEL="start"
MATRIX_END_LABEL="end"

# Place the profile legend outside the plot area, to the right of the last
# profile panel and vertically centred, instead of on top of the curves.
HEATMAP_LEGEND_OUTSIDE=1

# Summary-plot height in cm, independent of panel width. Keeps the profile a
# band across the top rather than a block that competes with the heatmaps.
HEATMAP_PROFILE_HEIGHT=3.2

# Gap between the summary plot and the heatmaps, in cm.
HEATMAP_PROFILE_SPACER=0.5

# Font sizes for the local matplotlibrc. The x tick labels have to shrink with
# the panel width or "center" and "3.0Kb" run into each other.
HEATMAP_FONT_SIZE=10
HEATMAP_TITLE_SIZE=11
HEATMAP_XTICK_SIZE=7
HEATMAP_YTICK_SIZE=9
HEATMAP_LEGEND_SIZE=7.5

# Horizontal room between the sample columns, handed to constrained_layout.
# Its defaults are wspace 0.02 and w_pad 0.04167.
HEATMAP_PANEL_WSPACE=0.004
HEATMAP_PANEL_WPAD=0.012
